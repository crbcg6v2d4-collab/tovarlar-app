<style>
  :root {
    --bg: #F3F2F7;
    --card: #FFFFFF;
    --line: #E4E2EC;
    --ink: #17151F;
    --muted: #6E6B7A;
    --accent: #17151F;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    font-family: -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 460px; margin: 0 auto; }
  h1 {
    font-size: 30px;
    font-weight: 700;
    margin: 4px 0 20px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  h1 .icon {
    width: 34px; height: 34px;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .card {
    background: var(--card);
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 1px 2px rgba(23,21,31,0.04);
  }
  label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin: 0 2px 6px;
  }
  .field { margin-bottom: 14px; position: relative; }
  input {
    width: 100%;
    padding: 15px 16px;
    border-radius: 14px;
    border: 1px solid var(--line);
    font-size: 17px;
    color: var(--ink);
    background: #fff;
    outline: none;
  }
  input:focus { border-color: var(--ink); }
  input::placeholder { color: #B7B4C2; }
  input[readonly] { background: #F6F5F9; color: var(--muted); }
  .suggestions {
    position: absolute;
    left: 0; right: 0; top: calc(100% + 6px);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: 0 8px 24px rgba(23,21,31,0.12);
    max-height: 260px;
    overflow-y: auto;
    z-index: 20;
    display: none;
  }
  .suggestions.show { display: block; }
  .sug-item {
    padding: 11px 16px;
    cursor: pointer;
    border-bottom: 1px solid var(--line);
  }
  .sug-item:last-child { border-bottom: none; }
  .sug-item:active { background: #F6F5F9; }
  .sug-item .sug-name { font-size: 14px; font-weight: 600; }
  .sug-item .sug-meta { font-size: 12px; color: var(--muted); margin-top: 2px; display: flex; justify-content: space-between; }
  .sug-empty { padding: 14px 16px; font-size: 13px; color: var(--muted); }
  button.add {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 14px;
    background: var(--accent);
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }
  button.add:active { opacity: 0.85; }
  .error {
    color: #C0392B;
    font-size: 13px;
    margin: -6px 0 12px 2px;
    display: none;
  }
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .stat {
    background: #F6F5F9;
    border-radius: 14px;
    padding: 16px 8px;
    text-align: center;
  }
  .stat .label { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .stat .value { font-size: 20px; font-weight: 700; }
  .list-card { padding: 8px 20px; }
  .item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 0;
    border-bottom: 1px solid var(--line);
  }
  .item:last-child { border-bottom: none; }
  .item .name { font-size: 15px; font-weight: 600; }
  .item .meta { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .item .right { text-align: right; display: flex; align-items: center; gap: 10px; }
  .item .price { font-weight: 600; min-width: 74px; text-align: right; }
  .qtybox {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #F6F5F9;
    border-radius: 10px;
    padding: 4px;
  }
  .qtybox button {
    width: 26px;
    height: 26px;
    border: none;
    border-radius: 8px;
    background: #fff;
    border: 1px solid var(--line);
    font-size: 15px;
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
    color: var(--ink);
  }
  .qtybox button:active { opacity: 0.8; }
  .qtybox .qtyval {
    min-width: 20px;
    text-align: center;
    font-size: 14px;
    font-weight: 600;
  }
  .item button.del {
    border: none;
    background: none;
    color: #C0392B;
    font-size: 13px;
    cursor: pointer;
  }
  .empty {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    padding: 24px 0;
  }
  .astatka-card {
    background: var(--ink);
    color: #fff;
  }
  .astatka-card .label { font-size: 13px; color: #ACA9B8; margin-bottom: 4px; }
  .astatka-card .balance { font-size: 34px; font-weight: 700; margin-bottom: 16px; }
  .astatka-row { display: flex; gap: 10px; }
  .astatka-row input {
    flex: 1;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.16);
    color: #fff;
  }
  .astatka-row input::placeholder { color: #8C899A; }
  .astatka-row button {
    border: none;
    border-radius: 14px;
    background: #fff;
    color: var(--ink);
    font-size: 15px;
    font-weight: 600;
    padding: 0 18px;
    cursor: pointer;
  }
  .sell-history { padding: 8px 20px; }
  .sell-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
  }
  .sell-item:last-child { border-bottom: none; }
  .sell-item .name { font-size: 14px; font-weight: 600; }
  .sell-item .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .sell-item .minus { color: #C0392B; font-weight: 700; font-size: 14px; }
  .sell-item .undo {
    border: none;
    background: none;
    color: var(--muted);
    font-size: 12px;
    text-decoration: underline;
    cursor: pointer;
    margin-left: 8px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1><span class="icon">📦</span>Tovarlar</h1>

    <div class="card astatka-card">
      <div class="label">Astatka (umumiy summa)</div>
      <div class="balance" id="astatkaBalance">$0.00</div>
      <div class="astatka-row">
        <input id="astatkaInput" type="number" inputmode="decimal" step="0.01" placeholder="Summani kiriting">
        <button onclick="setAstatka()">O'rnatish</button>
      </div>
    </div>

    <div class="card">
      <div class="field">
        <label for="sellName">Sotilgan model</label>
        <input id="sellName" type="text" placeholder="Model nomini yozing..." autocomplete="off" oninput="handleSellInput()" onfocus="handleSellInput()">
        <div class="suggestions" id="sellSuggestions"></div>
      </div>
      <div class="field">
        <label for="sellPrice">Narxi ($)</label>
        <input id="sellPrice" type="number" inputmode="decimal" step="0.01" placeholder="Ro'yxatdan tanlansa avtomatik to'ladi">
      </div>
      <div class="field" style="margin-bottom: 8px;">
        <label for="sellQty">Miqdori</label>
        <input id="sellQty" type="number" inputmode="numeric" placeholder="Masalan: 1" value="1">
      </div>
      <p class="error" id="sellErr">Model nomi va narxini to'g'ri kiriting.</p>
      <button class="add" onclick="sellProduct()" style="background:#C0392B;">− Sotildi, Astatkadan ayirish</button>
    </div>

    <div class="card sell-history" id="sellHistoryCard">
      <p class="empty" id="sellEmptyMsg">Hali sotuv qayd etilmagan.</p>
    </div>

    <div class="card">
      <div class="field">
        <label for="name">Model nomi</label>
        <input id="name" type="text" placeholder="Yozing: masalan GW 380, Fильтр..." autocomplete="off" oninput="handleNameInput()" onfocus="handleNameInput()">
        <div class="suggestions" id="suggestions"></div>
      </div>
      <div class="field">
        <label for="price">Narxi ($)</label>
        <input id="price" type="number" inputmode="decimal" step="0.01" placeholder="Ro'yxatdan tanlansa avtomatik to'ladi">
      </div>
      <div class="field" style="margin-bottom: 8px;">
        <label for="qty">Miqdori</label>
        <input id="qty" type="number" inputmode="numeric" placeholder="Masalan: 1" value="1">
      </div>
      <p class="error" id="err">Mahsulot nomi va narxini to'g'ri kiriting.</p>
      <button class="add" onclick="addProduct()">+ Tovar qo'shish</button>
    </div>

    <div class="card stats">
      <div class="stat">
        <div class="label">Tovarlar</div>
        <div class="value" id="statCount">0</div>
      </div>
      <div class="stat">
        <div class="label">Qoldiq</div>
        <div class="value" id="statQty">0</div>
      </div>
      <div class="stat">
        <div class="label">Qiymat</div>
        <div class="value" id="statValue">0 so'm</div>
      </div>
    </div>

    <div class="card list-card" id="listCard">
      <p class="empty" id="emptyMsg">Hali tovar qo'shilmagan.</p>
    </div>
  </div>

  let products = [];
  let selectedIdx = -1;
  let currentMatches = [];
  let astatka = 0;
  let soldHistory = [];
  let currentSellMatches = [];

  const STORAGE_KEY = 'tovarlar_astatka_data_v1';

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ products, astatka, soldHistory }));
    } catch (e) {
      // saqlash imkoni bo'lmasa (masalan cheklangan muhitda) jim o'tkazib yuboriladi
    }
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      const data = JSON.parse(raw);
      if (Array.isArray(data.products)) products = data.products;
      if (typeof data.astatka === 'number') astatka = data.astatka;
      if (Array.isArray(data.soldHistory)) soldHistory = data.soldHistory;
    } catch (e) {
      // buzilgan ma'lumot bo'lsa e'tiborsiz qoldiriladi
    }
  }

  // Telegram Mini App ichida ochilgan bo'lsa, uni to'liq ekranga moslashtirish
  if (window.Telegram && window.Telegram.WebApp) {
    try {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    } catch (e) {}
  }

  function formatUsd(n) {
    return '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function handleNameInput() {
    const nameEl = document.getElementById('name');
    const box = document.getElementById('suggestions');
    const q = nameEl.value.trim().toLowerCase();

    document.getElementById('price').readOnly = false;

    if (!q) {
      box.classList.remove('show');
      box.innerHTML = '';
      currentMatches = [];
      return;
    }

    currentMatches = PRICE_LIST.filter(p => p[0].toLowerCase().includes(q)).slice(0, 30);

    if (currentMatches.length === 0) {
      box.innerHTML = '<div class="sug-empty">Ro\'yxatda topilmadi — narxni qo\'lda kiriting.</div>';
      box.classList.add('show');
      return;
    }

    box.innerHTML = currentMatches.map((p, i) => `
      <div class="sug-item" onclick="selectProduct(${i})">
        <div class="sug-name">${escapeHtml(p[0])}</div>
        <div class="sug-meta"><span>${escapeHtml(p[1])}</span><span>${formatUsd(p[2])}</span></div>
      </div>
    `).join('');
    box.classList.add('show');
  }

  function selectProduct(i) {
    const p = currentMatches[i];
    if (!p) return;
    document.getElementById('name').value = p[0];
    document.getElementById('price').value = p[2];
    document.getElementById('price').readOnly = true;
    const box = document.getElementById('suggestions');
    box.classList.remove('show');
    box.innerHTML = '';
    document.getElementById('qty').focus();
  }

  document.addEventListener('click', function(e) {
    if (!e.target.closest('.field')) {
      document.getElementById('suggestions').classList.remove('show');
      document.getElementById('sellSuggestions').classList.remove('show');
    }
  });

  function renderAstatka() {
    document.getElementById('astatkaBalance').textContent = formatUsd(astatka);
  }

  function setAstatka() {
    const input = document.getElementById('astatkaInput');
    const val = parseFloat(input.value);
    if (isNaN(val) || val < 0) return;
    astatka = val;
    input.value = '';
    renderAstatka();
    saveState();
  }

  function handleSellInput() {
    const nameEl = document.getElementById('sellName');
    const box = document.getElementById('sellSuggestions');
    const q = nameEl.value.trim().toLowerCase();

    document.getElementById('sellPrice').readOnly = false;

    if (!q) {
      box.classList.remove('show');
      box.innerHTML = '';
      currentSellMatches = [];
      return;
    }

    currentSellMatches = PRICE_LIST.filter(p => p[0].toLowerCase().includes(q)).slice(0, 30);

    if (currentSellMatches.length === 0) {
      box.innerHTML = '<div class="sug-empty">Ro\'yxatda topilmadi — narxni qo\'lda kiriting.</div>';
      box.classList.add('show');
      return;
    }

    box.innerHTML = currentSellMatches.map((p, i) => `
      <div class="sug-item" onclick="selectSellProduct(${i})">
        <div class="sug-name">${escapeHtml(p[0])}</div>
        <div class="sug-meta"><span>${escapeHtml(p[1])}</span><span>${formatUsd(p[2])}</span></div>
      </div>
    `).join('');
    box.classList.add('show');
  }

  function selectSellProduct(i) {
    const p = currentSellMatches[i];
    if (!p) return;
    document.getElementById('sellName').value = p[0];
    document.getElementById('sellPrice').value = p[2];
    document.getElementById('sellPrice').readOnly = true;
    document.getElementById('sellSuggestions').classList.remove('show');
    document.getElementById('sellSuggestions').innerHTML = '';
    document.getElementById('sellQty').focus();
  }

  function sellProduct() {
    const nameEl = document.getElementById('sellName');
    const priceEl = document.getElementById('sellPrice');
    const qtyEl = document.getElementById('sellQty');
    const err = document.getElementById('sellErr');

    const name = nameEl.value.trim();
    const price = parseFloat(priceEl.value);
    const qty = parseInt(qtyEl.value || '1', 10);

    if (!name || isNaN(price) || price <= 0 || isNaN(qty) || qty <= 0) {
      err.style.display = 'block';
      return;
    }
    err.style.display = 'none';

    const total = price * qty;
    astatka -= total;

    soldHistory.unshift({
      id: Date.now(),
      name, price, qty, total,
      time: new Date().toLocaleString('uz-UZ', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })
    });

    nameEl.value = '';
    priceEl.value = '';
    priceEl.readOnly = false;
    qtyEl.value = '1';
    document.getElementById('sellSuggestions').classList.remove('show');
    nameEl.focus();

    renderAstatka();
    renderSellHistory();
    saveState();
  }

  function undoSell(id) {
    const idx = soldHistory.findIndex(s => s.id === id);
    if (idx === -1) return;
    astatka += soldHistory[idx].total;
    soldHistory.splice(idx, 1);
    renderAstatka();
    renderSellHistory();
    saveState();
  }

  function renderSellHistory() {
    const card = document.getElementById('sellHistoryCard');
    if (soldHistory.length === 0) {
      card.innerHTML = '<p class="empty" id="sellEmptyMsg">Hali sotuv qayd etilmagan.</p>';
      return;
    }
    card.innerHTML = soldHistory.map(s => `
      <div class="sell-item">
        <div>
          <div class="name">${escapeHtml(s.name)}${s.qty > 1 ? ' × ' + s.qty : ''}</div>
          <div class="meta">${s.time}</div>
        </div>
        <div>
          <span class="minus">−${formatUsd(s.total)}</span>
          <button class="undo" onclick="undoSell(${s.id})">bekor qilish</button>
        </div>
      </div>
    `).join('');
  }

  loadState();
  renderAstatka();
  renderSellHistory();
  render();

  function addProduct() {
    const nameEl = document.getElementById('name');
    const priceEl = document.getElementById('price');
    const qtyEl = document.getElementById('qty');
    const err = document.getElementById('err');

    const name = nameEl.value.trim();
    const price = parseFloat(priceEl.value);
    const qty = parseInt(qtyEl.value || '1', 10);

    if (!name || isNaN(price) || price <= 0 || isNaN(qty) || qty <= 0) {
      err.style.display = 'block';
      return;
    }
    err.style.display = 'none';

    const existing = products.find(p => p.name === name && p.price === price);
    if (existing) {
      existing.qty += qty;
    } else {
      products.push({ id: Date.now(), name, price, qty });
    }
    astatka += price * qty;
    renderAstatka();
    nameEl.value = '';
    priceEl.value = '';
    priceEl.readOnly = false;
    qtyEl.value = '1';
    document.getElementById('suggestions').classList.remove('show');
    nameEl.focus();
    render();
    saveState();
  }

  function removeProduct(id) {
    products = products.filter(p => p.id !== id);
    render();
    saveState();
  }

  function changeQty(id, delta) {
    const p = products.find(p => p.id === id);
    if (!p) return;
    p.qty += delta;
    if (p.qty <= 0) {
      products = products.filter(x => x.id !== id);
    }
    render();
    saveState();
  }

  function render() {
    const listCard = document.getElementById('listCard');
    const emptyMsg = document.getElementById('emptyMsg');

    if (products.length === 0) {
      listCard.innerHTML = '<p class="empty" id="emptyMsg">Hali tovar qo\'shilmagan.</p>';
    } else {
      listCard.innerHTML = products.map(p => `
        <div class="item">
          <div>
            <div class="name">${escapeHtml(p.name)}</div>
            <div class="meta">${formatUsd(p.price)} / dona</div>
          </div>
          <div class="right">
            <div class="qtybox">
              <button onclick="changeQty(${p.id}, -1)" aria-label="Kamaytirish">−</button>
              <span class="qtyval">${p.qty}</span>
              <button onclick="changeQty(${p.id}, 1)" aria-label="Ko'paytirish">+</button>
            </div>
            <span class="price">${formatUsd(p.price * p.qty)}</span>
            <button class="del" onclick="removeProduct(${p.id})">O'chirish</button>
          </div>
        </div>
      `).join('');
    }

    const totalCount = products.length;
    const totalQty = products.reduce((s, p) => s + p.qty, 0);
    const totalValue = products.reduce((s, p) => s + p.price * p.qty, 0);

    document.getElementById('statCount').textContent = totalCount;
    document.getElementById('statQty').textContent = totalQty;
    document.getElementById('statValue').textContent = formatUsd(totalValue);
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  render();
</script>
